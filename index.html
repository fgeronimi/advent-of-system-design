<!doctype html>
<html lang="fr" class="is-loading">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advent of System Design</title>
<meta name="description" content="24 jours, 24 concepts de system design, une cassette par jour.">
<link rel="preload" href="fonts/Newsreader-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/InterTight-normal-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/covers/sheet.webp" as="image">
<link rel="preload" href="assets/videoclub-bg.webp" as="image">
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.4"/>
    </marker>
  </defs>
</svg>

<header class="top">
  <span class="month lbl box"></span>
  <div class="logo"><span class="main">Advent of System Design</span><span class="sub">24 JOURS · 24 CONCEPTS</span></div>
</header>

<div class="garland" role="group"></div>

<nav class="tabs" aria-label="Thèmes">
  <span class="ind"></span>
  <button class="lbl" data-cat="today">Aujourd’hui</button>
</nav>

<section class="shelf" aria-label="Étagère des cassettes">
  <div class="stage"></div>
</section>

<div class="loader lbl" aria-hidden="true">▶ Chargement</div>

<button class="play" aria-label="Ouvrir le concept">
  <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M1.5 0.5 L11.5 6 L1.5 11.5 Z" fill="currentColor"/></svg>
</button>

<div class="caption" aria-live="polite">
  <div class="mask cap-title"></div>
  <div class="mask cap-sub lbl"></div>
  <div class="mask cap-day"></div>
</div>

<button class="arrow prev" aria-label="Jour précédent">
  <svg width="18" height="10" viewBox="0 0 18 10" aria-hidden="true"><path d="M5 1 L1 5 L5 9 M1 5 H17"/></svg>
</button>
<button class="arrow next" aria-label="Jour suivant">
  <svg width="18" height="10" viewBox="0 0 18 10" aria-hidden="true"><path d="M13 1 L17 5 L13 9 M17 5 H1"/></svg>
</button>

<footer class="foot">
  <span class="lbl">Advent of System Design</span>
  <span class="lbl hint">← → pour naviguer · Entrée pour ouvrir</span>
</footer>

<div class="grain" aria-hidden="true"></div>
<canvas class="snow" aria-hidden="true"></canvas>

<div class="detail" role="dialog" aria-modal="true" aria-label="Concept du jour">
  <button class="close lbl box">Fermer</button>
  <div class="band"><div class="logo"><span class="main">Advent of System Design</span><span class="sub">24 JOURS · 24 CONCEPTS</span></div></div>
  <div class="scroller">
    <div class="d-grid">
      <div class="info">
        <div class="hero">
          <div class="dm"><span class="d-sub lbl"></span></div>
          <div class="dm"><h1 class="d-title"></h1></div>
          <div class="dm"><span class="d-meta lbl"></span></div>
          <div class="dm"><p class="d-pitch"></p></div>
          <div class="dm"><p class="d-credit"></p></div>
          <div class="dm d-why-line"><p class="d-credit d-why"></p></div>
          <div class="dm">
            <div class="d-actions">
              <button class="pill lbl d-read">Lire la fiche ↓</button>
              <button class="pill ghost lbl d-next">Jour suivant →</button>
            </div>
          </div>
        </div>
        <div class="body"></div>
      </div>
      <div class="poster-col">
        <svg class="poster" viewBox="0 0 474 900" aria-hidden="true">
          <defs>
            <filter id="ink" filterUnits="userSpaceOnUse" x="-200" y="-200" width="874" height="1300">
              <feTurbulence type="fractalNoise" baseFrequency=".011" numOctaves="3" seed="7" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <mask id="inkMask" maskUnits="userSpaceOnUse" x="-200" y="-200" width="874" height="1300">
              <g filter="url(#ink)" fill="#fff">
                <circle cx="150" cy="330" r="0"/>
                <circle cx="340" cy="600" r="0"/>
                <circle cx="250" cy="120" r="0"/>
                <circle cx="90" cy="760" r="0"/>
                <circle cx="400" cy="250" r="0"/>
                <circle cx="260" cy="860" r="0"/>
                <circle cx="230" cy="470" r="0"/>
              </g>
            </mask>
            <clipPath id="posterClip"><rect width="474" height="900"/></clipPath>
          </defs>
          <g clip-path="url(#posterClip)" mask="url(#inkMask)" class="p-art"></g>
        </svg>
      </div>
    </div>
  </div>
</div>

<div class="cur" aria-hidden="true">
  <div class="ring"></div>
  <div class="dot"></div>
  <div class="cl"></div>
</div>

<div id="probe"></div>

<script src="concepts.js"></script>
<script src="app.js"></script>
</body>
</html>
